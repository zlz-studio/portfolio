name: Asset Store snapshot

# Refreshes data/assetstore.json (price, rating, favourites, version) once a day.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-assetstore.mjs
      - name: Commit if changed
        run: |
          git config user.name "assetstore-bot"
          git config user.email "assetstore-bot@users.noreply.github.com"
          git add data/assetstore.json
          # fetchedAt changes every run; only commit when a real value changed
          if git diff --cached -U0 data/assetstore.json | grep -E '^[+-] ' | grep -vq fetchedAt; then
            git commit -m "Update Asset Store snapshot"
            git push
          else
            echo "No listing changes."
          fi
